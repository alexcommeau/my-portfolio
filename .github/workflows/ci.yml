name: CI and publish image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/alexcommeau/my-portfolio

jobs:
  validate:
    name: Validate application and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Build test image
        run: |
          docker build \
            --build-arg APP_REVISION="${GITHUB_SHA}" \
            --tag my-portfolio:test \
            .

      - name: Verify image metadata and user
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' my-portfolio:test)" = "nextjs"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' my-portfolio:test)" = "${GITHUB_SHA}"

      - name: Start test container
        run: |
          docker run \
            --detach \
            --name my-portfolio-test \
            --publish 127.0.0.1:3000:3000 \
            my-portfolio:test

      - name: Wait for Docker healthcheck
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' my-portfolio-test)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              exit 1
            fi
            sleep 1
          done

          exit 1

      - name: Verify endpoints
        run: |
          health="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"
          test "$health" = "{\"status\":\"ok\",\"revision\":\"${GITHUB_SHA}\"}"
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/

      - name: Show container logs on failure
        if: failure()
        run: docker logs my-portfolio-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force my-portfolio-test || true

  publish:
    name: Publish image to GHCR
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-my-portfolio
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build release image
        run: |
          docker build \
            --build-arg APP_REVISION="${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:main" \
            .

      - name: Verify release image revision
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_NAME}:main")" = "${GITHUB_SHA}"

      - name: Push immutable commit tag
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Update main tag
        run: docker push "${IMAGE_NAME}:main"

      - name: Summarize publication
        run: |
          echo "### Published container image" >> "${GITHUB_STEP_SUMMARY}"
          echo "- \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- \`${IMAGE_NAME}:main\`" >> "${GITHUB_STEP_SUMMARY}"
